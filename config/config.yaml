# 路径相对于项目根目录（config/ 的上级目录）。
paths:
  source_model_dataset: data/source/processed_source/source_2014/model_dataset
  source_graph: data/source/processed_source/source_2014/graph
  target_model_dataset: data/target/processed_target_final/model_dataset
  target_graph: data/target/processed_target_final/graph
  target_metadata: data/target/processed_target_final/10_TARGET_SELECTED_METADATA.csv
  checkpoint_dir: outputs/checkpoints
  training_history_dir: outputs/training_history
  evaluation_dir: outputs/evaluation

target:
  # UNISOLAR站点使用澳大利亚东部当地时间，包含夏令时转换。
  timezone: Australia/Melbourne
  # 四个季度的独立测试时段，不参与训练、验证或Q99计算。
  test_periods:
    - {quarter: Q1, start: "2021-03-16", end: "2021-03-22"}
    - {quarter: Q2, start: "2021-06-11", end: "2021-06-17"}
    - {quarter: Q3, start: "2021-09-17", end: "2021-09-23"}
    - {quarter: Q4, start: "2021-10-12", end: "2021-10-18"}

evaluation:
  # 分别监控未来15分钟、1小时、2小时、3小时和4小时的误差。
  horizon_steps: [1, 4, 8, 12, 16]

node2vec:
  # 以下是第一版复现设置，不是论文明确给出的全部参数。
  embedding_dim: 32
  walk_length: 20
  num_walks: 20
  window_size: 5
  epochs: 50
  seed: 42
  # p 越小越容易立即返回；q 越小越倾向向外探索。均须大于 0。
  p: 1.0
  q: 1.0

forecast_model:
  # hidden_dim 是第一版复现设置；未来16步由当前数据集任务确定。
  hidden_dim: 32
  output_steps: 16

training:
  # 最多训练100轮；验证MAE连续10轮没有至少0.0001的改善时提前停止。
  batch_size: 64
  learning_rate: 0.001
  epochs: 100
  early_stopping_patience: 10
  early_stopping_min_delta: 0.0001

domain_adversarial:
  # 域分类器结构和GRL系数是第一版复现设置。
  hidden_dim: 32
  grl_lambda: 1.0

# 仅用于展示单条随机游走，不是正式训练超参数。
demo:
  start_node: ID089
